<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TOP 20 NOVA — Nova Stereo</title>

<style>

:root{
    --bg:#05070a;
    --panel:#0b0f14;
    --panel-2:#0e1319;
    --text:#ffffff;
    --muted:#89929d;
    --cyan:#00e5ff;
    --blue:#268cff;
    --orange:#ff7a18;
    --line:rgba(255,255,255,.075);
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(0,229,255,.09),
            transparent 38%
        ),
        var(--bg);
    color:var(--text);
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

/* =========================================================
   CONTENEDOR
========================================================= */

.nova-wrap{
    width:min(1180px, calc(100% - 32px));
    margin:0 auto;
    padding:54px 0 70px;
}

/* =========================================================
   CABECERA
========================================================= */

.nova-header{
    text-align:center;
    margin-bottom:48px;
}

.nova-kicker{
    display:inline-flex;
    align-items:center;
    gap:9px;
    font-size:11px;
    font-weight:800;
    letter-spacing:3px;
    color:var(--cyan);
    text-transform:uppercase;
    margin-bottom:13px;
}

.nova-kicker::before,
.nova-kicker::after{
    content:"";
    width:28px;
    height:1px;
    background:linear-gradient(
        90deg,
        transparent,
        var(--cyan)
    );
}

.nova-kicker::after{
    background:linear-gradient(
        90deg,
        var(--cyan),
        transparent
    );
}

.nova-title{
    margin:0;
    font-size:clamp(38px, 6vw, 72px);
    line-height:.92;
    font-weight:950;
    letter-spacing:-3px;
}

.nova-title span{
    background:linear-gradient(
        90deg,
        var(--cyan),
        #ffffff 48%,
        var(--orange)
    );
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.nova-subtitle{
    margin:17px auto 0;
    max-width:650px;
    color:var(--muted);
    font-size:14px;
    line-height:1.6;
}

/* =========================================================
   SEPARADOR
========================================================= */

.section-line{
    display:flex;
    align-items:center;
    gap:15px;
    margin:0 0 25px;
}

.section-line::before{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(
        90deg,
        transparent,
        var(--line)
    );
}

.section-line::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(
        90deg,
        var(--line),
        transparent
    );
}

.section-line span{
    color:#626c76;
    font-size:10px;
    font-weight:800;
    letter-spacing:2px;
    text-transform:uppercase;
}

/* =========================================================
   #1 — DESTACADO
========================================================= */

.featured{
    position:relative;
    overflow:hidden;

    min-height:430px;

    border:1px solid rgba(0,229,255,.18);
    border-radius:30px;

    background:
        radial-gradient(
            circle at 78% 35%,
            rgba(0,229,255,.13),
            transparent 30%
        ),
        radial-gradient(
            circle at 15% 100%,
            rgba(255,122,24,.08),
            transparent 30%
        ),
        linear-gradient(
            145deg,
            #0b1117,
            #070a0e
        );

    box-shadow:
        0 25px 80px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.035);

    display:grid;
    grid-template-columns:360px 1fr;
    align-items:center;

    padding:36px;
    margin-bottom:48px;
}

.featured::before{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    right:-120px;
    top:-140px;

    background:var(--cyan);
    opacity:.06;
    filter:blur(80px);
    border-radius:50%;
}

.featured-cover-wrap{
    position:relative;
    display:flex;
    justify-content:center;
}

.featured-cover{
    width:300px;
    height:300px;
    object-fit:cover;

    border-radius:24px;

    background:#10151b;

    box-shadow:
        0 22px 55px rgba(0,0,0,.6),
        0 0 0 1px rgba(0,229,255,.18),
        0 0 45px rgba(0,229,255,.10);
}

.featured-number{
    position:absolute;
    left:15px;
    bottom:-12px;

    font-size:76px;
    font-weight:950;
    line-height:.8;

    color:rgba(255,255,255,.08);
    letter-spacing:-5px;
}

.featured-info{
    padding:10px 20px 10px 45px;
}

.rank-label{
    display:flex;
    align-items:center;
    gap:10px;

    color:var(--orange);
    font-size:11px;
    font-weight:900;
    letter-spacing:2px;
    text-transform:uppercase;

    margin-bottom:17px;
}

.rank-label::before{
    content:"";
    width:30px;
    height:2px;
    background:var(--orange);
    box-shadow:0 0 10px rgba(255,122,24,.5);
}

.featured-title{
    margin:0;

    font-size:clamp(34px, 5vw, 58px);
    line-height:.98;
    letter-spacing:-2.5px;
    font-weight:950;
}

.featured-artist{
    margin-top:13px;

    color:#c1c8cf;
    font-size:16px;
    font-weight:600;
}

.featured-meta{
    display:flex;
    align-items:center;
    gap:9px;

    margin-top:21px;

    color:#68727d;
    font-size:11px;
    font-weight:800;
    letter-spacing:1.4px;
    text-transform:uppercase;
}

.featured-meta .dot{
    width:4px;
    height:4px;
    border-radius:50%;
    background:var(--cyan);
    box-shadow:0 0 8px var(--cyan);
}

.request-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;

    margin-top:30px;

    min-width:145px;
    height:44px;
    padding:0 20px;

    border-radius:999px;

    color:#ffffff;
    text-decoration:none;

    font-size:11px;
    font-weight:900;
    letter-spacing:1.3px;

    background:
        linear-gradient(
            135deg,
            rgba(0,229,255,.13),
            rgba(38,140,255,.12)
        );

    border:1px solid rgba(0,229,255,.45);

    box-shadow:
        0 0 20px rgba(0,229,255,.06);

    transition:
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease,
        background .25s ease;
}

.request-btn:hover{
    transform:translateY(-2px);

    border-color:var(--cyan);

    background:
        linear-gradient(
            135deg,
            rgba(0,229,255,.22),
            rgba(38,140,255,.18)
        );

    box-shadow:
        0 0 25px rgba(0,229,255,.16);
}

.request-btn svg{
    width:15px;
    height:15px;
}

/* =========================================================
   LISTA
========================================================= */

.ranking{
    display:flex;
    flex-direction:column;
    gap:13px;
}

.song{
    position:relative;

    display:grid;
    grid-template-columns:58px 74px 1fr auto;
    align-items:center;

    min-height:102px;
    padding:13px 17px 13px 10px;

    border:1px solid var(--line);
    border-radius:20px;

    background:
        linear-gradient(
            110deg,
            rgba(255,255,255,.025),
            rgba(255,255,255,.012)
        );

    transition:
        transform .25s ease,
        border-color .25s ease,
        background .25s ease,
        box-shadow .25s ease;
}

.song:hover{
    transform:translateX(4px);

    border-color:rgba(0,229,255,.20);

    background:
        linear-gradient(
            110deg,
            rgba(0,229,255,.045),
            rgba(255,255,255,.012)
        );

    box-shadow:
        0 12px 35px rgba(0,0,0,.25);
}

/* línea decorativa lateral */

.song::before{
    content:"";
    position:absolute;
    left:0;
    top:25%;
    width:2px;
    height:50%;

    border-radius:2px;

    background:linear-gradient(
        180deg,
        transparent,
        rgba(0,229,255,.5),
        transparent
    );

    opacity:.45;
}

/* =========================================================
   NÚMERO
========================================================= */

.song-rank{
    text-align:center;

    color:#4c5660;

    font-size:18px;
    font-weight:950;
    letter-spacing:-1px;
}

.song:nth-child(3n) .song-rank{
    color:#59636e;
}

/* =========================================================
   CARÁTULA
========================================================= */

.song-cover{
    width:70px;
    height:70px;

    object-fit:cover;

    border-radius:14px;

    background:#11161c;

    box-shadow:
        0 8px 22px rgba(0,0,0,.35),
        0 0 0 1px rgba(255,255,255,.045);

    display:block;
}

/* =========================================================
   INFORMACIÓN
========================================================= */

.song-info{
    min-width:0;
    padding:0 22px;
}

.song-title{
    margin:0;

    font-size:16px;
    line-height:1.25;

    font-weight:850;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    letter-spacing:-.2px;
}

.song-artist{
    margin-top:7px;

    color:#747e89;

    font-size:12px;
    font-weight:600;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.song-genre{
    display:inline-block;

    margin-top:8px;

    color:#56616d;

    font-size:8px;
    font-weight:900;
    letter-spacing:1.3px;
    text-transform:uppercase;
}

/* =========================================================
   BOTÓN
========================================================= */

.song-action{
    padding-left:15px;
}

.song-action .request-btn{
    margin-top:0;
    min-width:112px;
    height:38px;
    padding:0 16px;

    font-size:9px;
}

/* =========================================================
   FOOTER
========================================================= */

.nova-footer{
    text-align:center;
    margin-top:52px;
}

.nova-footer-line{
    width:100%;
    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--line),
            transparent
        );

    margin-bottom:28px;
}

.nova-footer strong{
    display:block;

    font-size:13px;
    font-weight:900;
    letter-spacing:1.5px;
}

.nova-footer p{
    margin:8px 0 0;

    color:#69737e;
    font-size:11px;
}

/* =========================================================
   ESTADOS
========================================================= */

.loading{
    min-height:300px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#68737e;

    font-size:12px;
    letter-spacing:1.5px;
    text-transform:uppercase;
}

.error{
    padding:40px;
    text-align:center;

    color:#89929d;

    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;
}

/* =========================================================
   TABLET
========================================================= */

@media(max-width:850px){

    .featured{
        grid-template-columns:260px 1fr;
        padding:28px;
    }

    .featured-cover{
        width:230px;
        height:230px;
    }

    .featured-info{
        padding-left:25px;
    }

    .featured-title{
        font-size:40px;
    }

}

/* =========================================================
   CELULAR
========================================================= */

@media(max-width:650px){

    .nova-wrap{
        width:min(100% - 20px, 520px);
        padding-top:35px;
    }

    .nova-header{
        margin-bottom:35px;
    }

    .nova-title{
        font-size:45px;
        letter-spacing:-2px;
    }

    .nova-subtitle{
        font-size:12px;
        padding:0 12px;
    }

    /* DESTACADO */

    .featured{
        display:block;

        min-height:auto;

        padding:22px;

        border-radius:25px;

        text-align:center;

        margin-bottom:38px;
    }

    .featured-cover-wrap{
        margin-bottom:25px;
    }

    .featured-cover{
        width:min(75vw,280px);
        height:min(75vw,280px);

        border-radius:21px;
    }

    .featured-number{
        left:calc(50% - 145px);
        bottom:-9px;

        font-size:62px;
    }

    .featured-info{
        padding:0;
    }

    .rank-label{
        justify-content:center;
    }

    .featured-title{
        font-size:35px;
        letter-spacing:-1.5px;
    }

    .featured-artist{
        font-size:13px;
        line-height:1.4;
    }

    .featured-meta{
        justify-content:center;
        font-size:9px;
    }

    .request-btn{
        margin-top:23px;
    }

    /* LISTA */

    .ranking{
        gap:10px;
    }

    .song{
        grid-template-columns:38px 58px 1fr;

        min-height:82px;

        padding:10px 10px 10px 5px;

        border-radius:17px;
    }

    .song-rank{
        font-size:14px;
    }

    .song-cover{
        width:55px;
        height:55px;
        border-radius:11px;
    }

    .song-info{
        padding:0 10px;
    }

    .song-title{
        font-size:13px;
    }

    .song-artist{
        margin-top:5px;
        font-size:10px;
    }

    .song-genre{
        margin-top:5px;
        font-size:7px;
    }

    .song-action{
        grid-column:3;
        padding:7px 10px 0 10px;
    }

    .song-action .request-btn{
        width:100%;
        height:32px;
        min-width:0;

        font-size:8px;
    }

}

/* =========================================================
   CELULAR MUY PEQUEÑO
========================================================= */

@media(max-width:390px){

    .nova-title{
        font-size:38px;
    }

    .featured-title{
        font-size:31px;
    }

    .song{
        grid-template-columns:34px 52px 1fr;
    }

    .song-cover{
        width:50px;
        height:50px;
    }

}

</style>
</head>

<body>

<div class="nova-wrap">

    <!-- CABECERA -->

    <header class="nova-header">

        <div class="nova-kicker">
            NOVA STEREO
        </div>

        <h1 class="nova-title">
            TOP <span>20</span> NOVA
        </h1>

        <p class="nova-subtitle">
            Las canciones que están sonando fuerte ahora.
            Música latina, tendencias y los éxitos que marcan el momento.
        </p>

    </header>


    <!-- CONTENIDO DINÁMICO -->

    <main id="app">

        <div class="loading">
            Cargando TOP 20 NOVA...
        </div>

    </main>


    <!-- FOOTER -->

    <footer class="nova-footer">

        <div class="nova-footer-line"></div>

        <strong>
            NOVA STEREO
        </strong>

        <p>
            Tu radio online · Música que conecta contigo
        </p>

    </footer>

</div>


<script>

const JSON_URL =
    "https://hcastro3122-hcj.github.io/nova-stereo-top20/top20.json";

const WHATSAPP =
    "50685838631";

const REFRESH_TIME =
    10 * 60 * 1000;


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   WHATSAPP
========================================================= */

function whatsappURL(song){

    const message =
        Hola Nova Stereo, quiero solicitar la canción "${song.title}" de ${song.artist}.;

    return (
        "https://wa.me/" +
        WHATSAPP +
        "?text=" +
        encodeURIComponent(message)
    );

}


/* =========================================================
   PORTADA DE RESPALDO
========================================================= */

function fallbackCover(){

    const svg = `
        <svg xmlns="http://www.w3.org/2000/svg"
             width="600"
             height="600"
             viewBox="0 0 600 600">

            <rect width="600"
                  height="600"
                  fill="#080d12"/>

            <circle
                cx="300"
                cy="300"
                r="205"
                fill="none"
                stroke="#00e5ff"
                stroke-width="4"
                opacity=".5"/>

            <circle
                cx="300"
                cy="300"
                r="165"
                fill="none"
                stroke="#ff7a18"
                stroke-width="2"
                opacity=".35"/>

            <text
                x="300"
                y="285"
                text-anchor="middle"
                fill="white"
                font-family="Arial"
                font-size="55"
                font-weight="900">
                NOVA
            </text>

            <text
                x="300"
                y="340"
                text-anchor="middle"
                fill="#00e5ff"
                font-family="Arial"
                font-size="30"
                font-weight="700">
                STEREO
            </text>

        </svg>
    `;

    return "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(svg);

}


/* =========================================================
   CREAR IMAGEN
========================================================= */

function coverURL(song){

    if(song.cover && song.cover.trim()){
        return song.cover;
    }

    return fallbackCover();

}


/* =========================================================
   BOTÓN
========================================================= */

function requestButton(song){

    return `
        <a
            class="request-btn"
            href="${whatsappURL(song)}"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Solicitar ${escapeHTML(song.title)}"
        >

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M21 11.5a8.38 8.38 0 0 1-9 8.3 8.5 8.5 0 0 1-4-.95L3 20l1.2-4.5A8.2 8.2 0 0 1 3 11.5a8.5 8.5 0 1 1 18 0Z"/>
                <path d="M8 11.5h.01"/>
                <path d="M12 11.5h.01"/>
                <path d="M16 11.5h.01"/>
            </svg>

            SOLICITAR

        </a>
    `;

}


/* =========================================================
   CANCIÓN #1
========================================================= */

function renderFeatured(song){

    return `

        <div class="section-line">
            <span>La número uno</span>
        </div>

        <section class="featured">

            <div class="featured-cover-wrap">

                <img
                    class="featured-cover"
                    src="${escapeHTML(coverURL(song))}"
                    alt="${escapeHTML(song.title)}"
                    loading="eager"
                    onerror="this.onerror=null;this.src='${fallbackCover()}'"
                >

                <div class="featured-number">
                    01
                </div>

            </div>


            <div class="featured-info">

                <div class="rank-label">
                    TOP 01
                </div>

                <h2 class="featured-title">
                    ${escapeHTML(song.title)}
                </h2>

                <div class="featured-artist">
                    ${escapeHTML(song.artist)}
                </div>

                <div class="featured-meta">

                    <span>
                        ${escapeHTML(song.genre || "Tendencia")}
                    </span>

                    <span class="dot"></span>

                    <span>
                        NOVA STEREO
                    </span>

                </div>

                ${requestButton(song)}

            </div>

        </section>

    `;

}


/* =========================================================
   CANCIONES 02–20
========================================================= */

function renderSong(song){

    const position =
        String(song.position).padStart(2, "0");

    return `

        <article class="song">

            <div class="song-rank">
                ${position}
            </div>


            <img
                class="song-cover"
                src="${escapeHTML(coverURL(song))}"
                alt="${escapeHTML(song.title)}"
                loading="lazy"
                onerror="this.onerror=null;this.src='${fallbackCover()}'"
            >


            <div class="song-info">

                <h3 class="song-title">
                    ${escapeHTML(song.title)}
                </h3>

                <div class="song-artist">
                    ${escapeHTML(song.artist)}
                </div>

                <span class="song-genre">
                    ${escapeHTML(song.genre || "NOVA")}
                </span>

            </div>


            <div class="song-action">

                ${requestButton(song)}

            </div>

        </article>

    `;

}


/* =========================================================
   CARGAR RANKING
========================================================= */

async function loadRanking(){

    const app =
        document.getElementById("app");

    try{

        const response =
            await fetch(
                JSON_URL +
                "?t=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){
            throw new Error(
                "No se pudo cargar top20.json"
            );
        }

        const data =
            await response.json();

        if(!Array.isArray(data) || !data.length){
            throw new Error(
                "El ranking está vacío"
            );
        }

        const songs =
            data
                .slice()
                .sort(
                    (a,b) =>
                        Number(a.position || 999) -
                        Number(b.position || 999)
                )
                .slice(0,20);

        const first =
            songs[0];

        const rest =
            songs.slice(1);

        app.innerHTML = `

            ${renderFeatured(first)}

            <div class="section-line">
                <span>Posiciones 02 — 20</span>
            </div>

            <section class="ranking">

                ${rest.map(renderSong).join("")}

            </section>

        `;

    }
    catch(error){

        console.error(error);

        app.innerHTML = `

            <div class="error">

                <strong>
                    No pudimos cargar el TOP 20 NOVA.
                </strong>

                <br><br>

                Intenta actualizar la página en unos segundos.

            </div>

        `;

    }

}


/* =========================================================
   INICIO
========================================================= */

loadRanking();


/* =========================================================
   ACTUALIZACIÓN AUTOMÁTICA
========================================================= */

setInterval(
    loadRanking,
    REFRESH_TIME
);

</script>

</body>
</html>
