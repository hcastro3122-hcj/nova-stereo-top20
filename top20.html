<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TOP 20 NOVA</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#050609;
    color:#fff;
    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;
}

.nova-wrap{
    width:calc(100% - 28px);
    max-width:1180px;
    margin:auto;
    padding:42px 0 60px;
}

/* =====================================================
   CABECERA
===================================================== */

.header{
    text-align:center;
    margin-bottom:42px;
}

.kicker{
    display:inline-flex;
    align-items:center;
    gap:10px;

    color:#00e5ff;

    font-size:10px;
    font-weight:900;

    letter-spacing:3px;

    margin-bottom:14px;
}

.kicker::before,
.kicker::after{
    content:"";

    width:25px;
    height:1px;

    background:#00e5ff;

    opacity:.55;
}

.title{
    margin:0;

    font-size:clamp(44px,7vw,70px);

    line-height:.9;

    font-weight:950;

    letter-spacing:-4px;
}

.title span{
    background:
        linear-gradient(
            90deg,
            #00e5ff,
            #268cff,
            #ff7a18
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}

.subtitle{
    max-width:650px;

    margin:17px auto 0;

    color:#737d87;

    font-size:13px;

    line-height:1.6;
}

/* =====================================================
   SEPARADORES
===================================================== */

.label{
    display:flex;
    align-items:center;

    gap:14px;

    margin-bottom:18px;
}

.label::before,
.label::after{
    content:"";

    height:1px;

    flex:1;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.10)
        );
}

.label::after{
    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.10),
            transparent
        );
}

.label span{
    color:#68727c;

    font-size:9px;

    font-weight:900;

    letter-spacing:2px;

    text-transform:uppercase;
}

/* =====================================================
   #1
===================================================== */

.featured{

    position:relative;

    display:grid;

    grid-template-columns:300px 1fr;

    align-items:center;

    gap:38px;

    padding:30px;

    margin-bottom:43px;

    border-radius:27px;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 85% 20%,
            rgba(0,229,255,.12),
            transparent 31%
        ),
        radial-gradient(
            circle at 10% 100%,
            rgba(255,122,24,.07),
            transparent 30%
        ),
        linear-gradient(
            145deg,
            #0c1117,
            #080a0e
        );

    border:1px solid rgba(0,229,255,.18);

    box-shadow:
        0 25px 65px rgba(0,0,0,.45);
}

.featured::after{

    content:"";

    position:absolute;

    right:-100px;
    bottom:-130px;

    width:280px;
    height:280px;

    border-radius:50%;

    background:#ff7a18;

    opacity:.035;

    filter:blur(60px);
}

.featured-cover{

    width:270px;
    height:270px;

    display:block;

    margin:auto;

    object-fit:cover;

    border-radius:22px;

    background:#10151b;

    box-shadow:
        0 20px 45px rgba(0,0,0,.65),
        0 0 0 1px rgba(0,229,255,.18),
        0 0 35px rgba(0,229,255,.08);
}

.featured-info{
    min-width:0;
}

.featured-label{

    display:flex;

    align-items:center;

    gap:9px;

    color:#ff7a18;

    font-size:10px;

    font-weight:900;

    letter-spacing:2.5px;

    margin-bottom:14px;
}

.featured-label::before{

    content:"";

    width:27px;
    height:2px;

    background:#ff7a18;

    box-shadow:
        0 0 10px rgba(255,122,24,.45);
}

.featured-title{

    margin:0;

    font-size:clamp(34px,5vw,56px);

    line-height:.98;

    font-weight:950;

    letter-spacing:-2.5px;

}

.featured-artist{

    margin-top:12px;

    color:#c1c8cf;

    font-size:15px;

    font-weight:600;
}

.featured-genre{

    margin-top:15px;

    color:#65707b;

    font-size:8px;

    font-weight:900;

    letter-spacing:2px;

    text-transform:uppercase;
}

/* =====================================================
   BOTÓN NARANJA
===================================================== */

.request{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    height:37px;

    min-width:105px;

    padding:0 17px;

    margin-top:25px;

    border-radius:999px;

    text-decoration:none;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #ff8a25,
            #ff6410
        );

    border:1px solid rgba(255,180,100,.30);

    box-shadow:
        0 7px 20px rgba(255,102,16,.14);

    font-size:9px;

    font-weight:900;

    letter-spacing:1.5px;

    transition:
        transform .22s ease,
        box-shadow .22s ease,
        filter .22s ease;
}

.request:hover{

    transform:translateY(-2px);

    filter:brightness(1.1);

    box-shadow:
        0 10px 28px rgba(255,102,16,.25);
}

/* =====================================================
   DOS COLUMNAS
===================================================== */

.ranking{

    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:12px 15px;
}

/* =====================================================
   CANCIÓN
===================================================== */

.song{

    position:relative;

    min-width:0;

    display:grid;

    grid-template-columns:
        49px 58px 1fr;

    grid-template-rows:auto auto;

    align-items:center;

    padding:9px 11px 9px 6px;

    min-height:82px;

    border-radius:16px;

    border:1px solid rgba(255,255,255,.065);

    background:
        linear-gradient(
            120deg,
            rgba(255,255,255,.027),
            rgba(255,255,255,.008)
        );

    transition:
        transform .23s ease,
        border-color .23s ease,
        background .23s ease;
}

.song:hover{

    transform:translateY(-2px);

    border-color:
        rgba(0,229,255,.23);

    background:
        linear-gradient(
            120deg,
            rgba(0,229,255,.045),
            rgba(255,255,255,.012)
        );
}

/* línea lateral */

.song::before{

    content:"";

    position:absolute;

    left:0;

    top:20%;

    width:2px;

    height:60%;

    border-radius:4px;

    background:
        linear-gradient(
            180deg,
            transparent,
            #00e5ff,
            transparent
        );

    opacity:.55;
}

/* =====================================================
   NÚMEROS
===================================================== */

.rank{

    grid-row:1 / span 2;

    text-align:center;

    font-size:24px;

    line-height:1;

    font-weight:950;

    letter-spacing:-1.5px;

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #00e5ff 48%,
            #268cff 100%
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    filter:
        drop-shadow(
            0 0 8px rgba(0,229,255,.12)
        );
}

/* =====================================================
   CARÁTULA
===================================================== */

.cover{

    grid-row:1 / span 2;

    width:56px;
    height:56px;

    display:block;

    object-fit:cover;

    border-radius:11px;

    background:#11161c;

    box-shadow:
        0 7px 17px rgba(0,0,0,.45),
        0 0 0 1px rgba(255,255,255,.04);
}

/* =====================================================
   INFO
===================================================== */

.song-info{

    min-width:0;

    padding-left:12px;

    padding-right:4px;
}

.song-title{

    margin:0;

    color:#fff;

    font-size:13px;

    line-height:1.2;

    font-weight:850;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.artist{

    margin-top:5px;

    color:#747e88;

    font-size:9.5px;

    line-height:1.2;

    font-weight:600;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.genre{

    display:block;

    margin-top:5px;

    color:#4e5964;

    font-size:7px;

    font-weight:900;

    letter-spacing:1.3px;

    text-transform:uppercase;
}

/* =====================================================
   BOTÓN DE CADA CANCIÓN
===================================================== */

.action{

    grid-column:3;

    padding-left:12px;

    margin-top:7px;
}

.action .request{

    margin:0;

    height:28px;

    min-width:82px;

    padding:0 12px;

    font-size:7px;

    letter-spacing:1.2px;
}

/* =====================================================
   FOOTER
===================================================== */

.footer{

    margin-top:48px;

    padding-top:25px;

    border-top:1px solid rgba(255,255,255,.055);

    text-align:center;

    color:#4f5a65;

    font-size:9px;

    font-weight:800;

    letter-spacing:2px;
}

/* =====================================================
   TABLET
===================================================== */

@media(max-width:800px){

    .featured{

        grid-template-columns:240px 1fr;

        gap:28px;

        padding:25px;
    }

    .featured-cover{

        width:215px;
        height:215px;
    }

    .featured-title{

        font-size:40px;
    }

}

/* =====================================================
   CELULAR
===================================================== */

@media(max-width:600px){

    .nova-wrap{

        width:calc(100% - 18px);

        padding-top:30px;
    }

    .header{

        margin-bottom:32px;
    }

    .title{

        font-size:44px;

        letter-spacing:-2.5px;
    }

    .subtitle{

        font-size:11px;

        padding:0 8px;
    }

    /* DESTACADO */

    .featured{

        display:block;

        text-align:center;

        padding:22px;

        border-radius:23px;
    }

    .featured-cover{

        width:min(72vw,270px);

        height:min(72vw,270px);

        margin-bottom:24px;
    }

    .featured-label{

        justify-content:center;
    }

    .featured-title{

        font-size:34px;
    }

    .featured-artist{

        font-size:13px;
    }

    .featured-genre{

        margin-top:12px;
    }

    /* DOS COLUMNAS TAMBIÉN EN CELULAR */

    .ranking{

        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap:9px;
    }

    .song{

        display:grid;

        grid-template-columns:
            28px 43px 1fr;

        min-height:112px;

        padding:8px 7px 8px 3px;

        border-radius:14px;
    }

    .rank{

        font-size:17px;

        letter-spacing:-1px;
    }

    .cover{

        width:41px;
        height:41px;

        border-radius:8px;
    }

    .song-info{

        padding-left:7px;
    }

    .song-title{

        font-size:10px;
    }

    .artist{

        font-size:8px;

        margin-top:4px;
    }

    .genre{

        font-size:6px;

        margin-top:4px;
    }

    .action{

        grid-column:3;

        padding-left:7px;

        margin-top:5px;
    }

    .action .request{

        width:100%;

        min-width:0;

        height:25px;

        padding:0 5px;

        font-size:6px;

        letter-spacing:.8px;
    }

}

/* =====================================================
   CELULARES MUY PEQUEÑOS
===================================================== */

@media(max-width:360px){

    .ranking{

        gap:7px;
    }

    .song{

        grid-template-columns:
            25px 39px 1fr;

        padding-right:5px;
    }

    .cover{

        width:37px;
        height:37px;
    }

    .rank{

        font-size:15px;
    }

    .song-title{

        font-size:9px;
    }

}

</style>
</head>

<body>

<div class="nova-wrap">

<header class="header">

    <div class="kicker">
        NOVA STEREO
    </div>

    <h1 class="title">
        TOP <span>20</span> NOVA
    </h1>

    <p class="subtitle">
        Las canciones que están sonando fuerte ahora.
        Tendencias, música latina y los éxitos del momento.
    </p>

</header>


<div id="app">

    <div class="loading">
        CARGANDO TOP 20 NOVA...
    </div>

</div>


<footer class="footer">
    NOVA STEREO · TU RADIO ONLINE
</footer>

</div>


<script>

const JSON_URL =
"https://hcastro3122-hcj.github.io/nova-stereo-top20/top20.json";

const WHATSAPP =
"50685838631";


function escapeHTML(text){

    return String(text || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function cover(song){

    if(
        song &&
        typeof song.cover === "string" &&
        song.cover.trim() !== ""
    ){

        return song.cover;

    }

    return "https://dummyimage.com/600x600/0b1117/00e5ff&text=NOVA+STEREO";

}


function whatsapp(song){

    const message =
        "Hola Nova Stereo, quiero solicitar la canción \"" +
        (song.title || "") +
        "\" de " +
        (song.artist || "") +
        ".";

    return (
        "https://wa.me/" +
        WHATSAPP +
        "?text=" +
        encodeURIComponent(message)
    );

}


function button(song){

    return `
        <a
            class="request"
            href="${whatsapp(song)}"
            target="_blank"
            rel="noopener noreferrer"
        >
            SOLICITAR
        </a>
    `;

}


function featured(song){

    return `

        <div class="label">
            <span>La número uno</span>
        </div>

        <section class="featured">

            <div>

                <img
                    class="featured-cover"
                    src="${escapeHTML(cover(song))}"
                    alt="${escapeHTML(song.title)}"
                    onerror="this.onerror=null;this.src='https://dummyimage.com/600x600/0b1117/00e5ff&text=NOVA+STEREO'"
                >

            </div>


            <div class="featured-info">

                <div class="featured-label">
                    TOP 01
                </div>

                <h2 class="featured-title">
                    ${escapeHTML(song.title)}
                </h2>

                <div class="featured-artist">
                    ${escapeHTML(song.artist)}
                </div>

                <div class="featured-genre">
                    ${escapeHTML(song.genre || "NOVA STEREO")}
                </div>

                ${button(song)}

            </div>

        </section>

    `;

}


function songHTML(song){

    const position =
        String(song.position || "").padStart(2,"0");

    return `

        <article class="song">

            <div class="rank">
                ${position}
            </div>


            <img
                class="cover"
                src="${escapeHTML(cover(song))}"
                alt="${escapeHTML(song.title)}"
                loading="lazy"
                onerror="this.onerror=null;this.src='https://dummyimage.com/600x600/0b1117/00e5ff&text=NOVA+STEREO'"
            >


            <div class="song-info">

                <h3 class="song-title">
                    ${escapeHTML(song.title)}
                </h3>

                <div class="artist">
                    ${escapeHTML(song.artist)}
                </div>

                <span class="genre">
                    ${escapeHTML(song.genre || "NOVA")}
                </span>

            </div>


            <div class="action">

                ${button(song)}

            </div>

        </article>

    `;

}


async function loadTop20(){

    const app =
        document.getElementById("app");

    try{

        const response =
            await fetch(
                JSON_URL +
                "?v=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }

        const data =
            await response.json();

        if(
            !Array.isArray(data) ||
            data.length === 0
        ){

            throw new Error(
                "No hay canciones disponibles."
            );

        }

        const songs =
            data
                .slice()
                .sort(function(a,b){

                    return (
                        Number(a.position || 999) -
                        Number(b.position || 999)
                    );

                })
                .slice(0,20);


        let output =
            featured(songs[0]);


        output += `

            <div class="label">
                <span>Posiciones 02 — 20</span>
            </div>

            <section class="ranking">
        `;


        for(
            let i = 1;
            i < songs.length;
            i++
        ){

            output +=
                songHTML(songs[i]);

        }


        output += `
            </section>
        `;


        app.innerHTML =
            output;

    }
    catch(error){

        console.error(
            "TOP 20 NOVA:",
            error
        );

        app.innerHTML = `

            <div
                style="
                    padding:40px;
                    text-align:center;
                    color:#89939d;
                    border:1px solid rgba(255,255,255,.08);
                    border-radius:20px;
                "
            >

                No pudimos cargar el TOP 20 NOVA.

            </div>

        `;

    }

}


loadTop20();

</script>

</body>
</html>
