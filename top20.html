<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>TOP 20 NOVA</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
    background:#050505;
    color:#fff;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body{
    overflow-x:hidden;
}

.nova-top20{

    width:100%;
    min-height:100vh;

    padding:
        70px
        24px
        80px;

    background:

        radial-gradient(
            circle at 50% 0%,
            rgba(0,234,255,.13),
            transparent 34%
        ),

        radial-gradient(
            circle at 100% 50%,
            rgba(255,90,0,.08),
            transparent 30%
        ),

        #050505;
}


/* ==========================================================
   HEADER
========================================================== */

.header{

    max-width:1200px;

    margin:
        0 auto
        55px;

    text-align:center;
}

.kicker{

    display:inline-block;

    padding:
        7px
        18px;

    margin-bottom:15px;

    border:
        1px solid
        rgba(0,234,255,.55);

    border-radius:30px;

    color:#00eaff;

    font-size:12px;

    font-weight:800;

    letter-spacing:3px;

    text-transform:uppercase;

    box-shadow:
        0 0 20px
        rgba(0,234,255,.12);
}

.header h1{

    font-size:
        clamp(
            50px,
            8vw,
            95px
        );

    line-height:.9;

    font-weight:1000;

    letter-spacing:-4px;

    text-transform:uppercase;

    text-shadow:
        0 0 30px
        rgba(0,234,255,.14);
}

.header h1 span{

    color:#00eaff;

    text-shadow:
        0 0 10px
        rgba(0,234,255,.55),
        0 0 35px
        rgba(0,234,255,.25);
}

.subtitle{

    margin-top:22px;

    color:#9c9c9c;

    font-size:14px;

    letter-spacing:2px;

    text-transform:uppercase;
}


/* ==========================================================
   STATUS
========================================================== */

.status{

    max-width:1200px;

    margin:
        0 auto
        25px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:20px;

    color:#707070;

    font-size:11px;

    letter-spacing:1px;

    text-transform:uppercase;
}

.status-live{

    display:flex;

    align-items:center;

    gap:8px;
}

.status-dot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#00eaff;

    box-shadow:
        0 0 12px
        #00eaff;
}


/* ==========================================================
   TOP 1
========================================================== */

.top-one{

    max-width:1200px;

    margin:
        0 auto
        30px;

    padding:25px;

    display:grid;

    grid-template-columns:
        190px
        1fr
        auto;

    align-items:center;

    gap:30px;

    border:
        1px solid
        rgba(0,234,255,.55);

    border-radius:28px;

    background:

        linear-gradient(
            135deg,
            rgba(0,234,255,.09),
            rgba(255,90,0,.035),
            rgba(0,0,0,.85)
        );

    box-shadow:

        0 0 35px
        rgba(0,234,255,.10),

        inset 0 0 50px
        rgba(0,234,255,.035);

    overflow:hidden;
}


/* CARATULA #1 */

.top-cover{

    position:relative;

    width:170px;
    height:170px;

    border-radius:22px;

    overflow:hidden;

    border:
        1px solid
        rgba(0,234,255,.55);

    box-shadow:

        0 0 25px
        rgba(0,234,255,.18),

        0 15px 35px
        rgba(0,0,0,.45);
}

.top-cover img{

    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

    transition:
        transform .5s ease;
}

.top-one:hover
.top-cover img{

    transform:scale(1.04);
}


/* #1 */

.top-label{

    color:#ff6900;

    font-size:11px;

    font-weight:900;

    letter-spacing:3px;

    margin-bottom:10px;

    text-transform:uppercase;
}

.top-title{

    font-size:
        clamp(
            27px,
            4vw,
            48px
        );

    font-weight:950;

    line-height:1.02;

    letter-spacing:-1px;
}

.top-artist{

    margin-top:12px;

    color:#00eaff;

    font-size:16px;

    font-weight:800;

    letter-spacing:.7px;
}


/* ==========================================================
   BOTON
========================================================== */

.request{

    border:
        1px solid
        #ff6500;

    border-radius:12px;

    padding:
        14px
        20px;

    background:
        rgba(255,90,0,.07);

    color:#fff;

    font-size:11px;

    font-weight:950;

    letter-spacing:2px;

    cursor:pointer;

    transition:
        .25s ease;

    white-space:nowrap;
}

.request:hover{

    background:#ff6500;

    color:#050505;

    transform:
        translateY(-2px);

    box-shadow:
        0 0 22px
        rgba(255,90,0,.4);
}


/* ==========================================================
   RANKING
========================================================== */

.ranking{

    max-width:1200px;

    margin:0 auto;

    display:grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );

    gap:16px;
}


/* ==========================================================
   SONG CARD
========================================================== */

.song{

    min-height:115px;

    display:grid;

    grid-template-columns:
        55px
        62px
        1fr
        auto;

    align-items:center;

    gap:15px;

    padding:
        15px
        17px;

    border:
        1px solid
        rgba(255,255,255,.09);

    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.012)
        );

    transition:
        .25s ease;

    position:relative;

    overflow:hidden;
}

.song:hover{

    transform:
        translateY(-3px);

    border-color:
        rgba(0,234,255,.42);

    box-shadow:
        0 12px 35px
        rgba(0,0,0,.4);
}


/* NUMERO */

.position{

    color:#00eaff;

    font-size:21px;

    font-weight:1000;

    text-align:center;
}


/* MINI CARATULA */

.cover{

    width:62px;
    height:62px;

    border-radius:13px;

    overflow:hidden;

    border:
        1px solid
        rgba(0,234,255,.22);

    background:#111;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.4);
}

.cover img{

    width:100%;
    height:100%;

    display:block;

    object-fit:cover;
}


/* TEXTO */

.song-title{

    font-size:16px;

    font-weight:900;

    line-height:1.15;

    color:#fff;
}

.song-artist{

    margin-top:6px;

    color:#888;

    font-size:11px;

    font-weight:650;

    letter-spacing:.3px;
}

.song .request{

    padding:
        10px
        13px;

    font-size:9px;

    border-radius:9px;
}


/* ==========================================================
   FOOTER
========================================================== */

.footer{

    max-width:1200px;

    margin:
        45px auto
        0;

    padding-top:25px;

    border-top:
        1px solid
        rgba(255,255,255,.08);

    display:flex;

    justify-content:space-between;

    color:#707070;

    font-size:11px;

    letter-spacing:.5px;
}

.footer strong{
    color:#fff;
}


/* ==========================================================
   LOADING
========================================================== */

.loading{

    max-width:1200px;

    margin:auto;

    padding:80px 20px;

    text-align:center;

    color:#777;
}

.loader{

    width:40px;
    height:40px;

    margin:
        0 auto
        18px;

    border-radius:50%;

    border:
        2px solid
        rgba(0,234,255,.12);

    border-top-color:#00eaff;

    animation:
        spin .8s
        linear
        infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }
}


/* ==========================================================
   ERROR
========================================================== */

.error{

    max-width:800px;

    margin:auto;

    padding:30px;

    text-align:center;

    border:
        1px solid
        rgba(255,90,0,.35);

    border-radius:18px;

    color:#ff7835;

    background:
        rgba(255,90,0,.04);
}


/* ==========================================================
   MOBILE
========================================================== */

@media(max-width:850px){

    .nova-top20{

        padding:
            55px
            15px
            60px;
    }

    .top-one{

        grid-template-columns:
            125px
            1fr;

        gap:20px;

        padding:20px;
    }

    .top-cover{

        width:125px;
        height:125px;
    }

    .top-one .request{

        grid-column:
            1 / -1;

        width:100%;
    }

    .ranking{

        grid-template-columns:1fr;
    }
}


@media(max-width:550px){

    .header h1{

        font-size:55px;

        letter-spacing:-3px;
    }

    .subtitle{

        font-size:10px;

        letter-spacing:1px;
    }

    .status{

        font-size:8px;
    }

    .top-one{

        grid-template-columns:
            95px
            1fr;
    }

    .top-cover{

        width:95px;
        height:95px;

        border-radius:16px;
    }

    .top-title{

        font-size:23px;
    }

    .top-artist{

        font-size:12px;
    }

    .song{

        grid-template-columns:
            35px
            52px
            1fr;

        gap:10px;

        padding:13px;
    }

    .position{

        font-size:17px;
    }

    .cover{

        width:52px;
        height:52px;
    }

    .song-title{

        font-size:14px;
    }

    .song .request{

        grid-column:
            3;

        width:max-content;
    }

    .footer{

        flex-direction:column;

        text-align:center;

        gap:10px;
    }
}

</style>

</head>


<body>

<section class="nova-top20">

<header class="header">

    <div class="kicker">
        NOVA STEREO
    </div>

    <h1>
        TOP <span>20</span> NOVA
    </h1>

    <div class="subtitle">
        Tendencias musicales · Lo que está sonando ahora
    </div>

</header>


<div class="status">

    <div class="status-live">

        <span class="status-dot"></span>

        Ranking automático

    </div>

    <div id="updated">
        Actualizando...
    </div>

</div>


<div id="content">

    <div class="loading">

        <div class="loader"></div>

        Cargando TOP 20 NOVA...

    </div>

</div>


</section>


<script>


const JSON_URL =
"https://hcastro3122-hcj.github.io/nova-stereo-top20/top20.json";


const WHATSAPP =
"https://wa.me/50685838631";


/* ==========================================================
   ESCAPAR HTML
========================================================== */

function escapar(texto){

    return String(
        texto || ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ==========================================================
   SOLICITAR POR WHATSAPP
========================================================== */

function solicitar(
    cancion,
    artista
){

    const mensaje =
        "Hola Nova Stereo 👋\n\n" +
        "Quiero solicitar esta canción:\n\n" +
        cancion +
        "\n" +
        artista;

    const url =
        WHATSAPP +
        "?text=" +
        encodeURIComponent(
            mensaje
        );

    window.open(
        url,
        "_blank"
    );

}


/* ==========================================================
   OBTENER CANCIONES
========================================================== */

function obtenerCanciones(data){

    if(Array.isArray(data)){

        return data;

    }

    if(
        data &&
        Array.isArray(data.songs)
    ){

        return data.songs;

    }

    if(
        data &&
        Array.isArray(data.top20)
    ){

        return data.top20;

    }

    return [];

}


/* ==========================================================
   CARGAR TOP 20
========================================================== */

async function cargarTop20(){

    try{

        const respuesta =
            await fetch(
                JSON_URL +
                "?v=" +
                Date.now(),
                {
                    cache:
                        "no-store"
                }
            );


        if(!respuesta.ok){

            throw new Error(
                "No se pudo cargar el JSON."
            );

        }


        const data =
            await respuesta.json();


        const canciones =
            obtenerCanciones(
                data
            ).slice(
                0,
                20
            );


        if(
            canciones.length === 0
        ){

            throw new Error(
                "El ranking está vacío."
            );

        }


        renderizar(
            canciones
        );


    }catch(error){

        console.error(
            error
        );


        document.getElementById(
            "content"
        ).innerHTML = `

            <div class="error">

                No pudimos cargar
                el TOP 20 NOVA
                en este momento.

            </div>

        `;

    }

}


/* ==========================================================
   RENDER
========================================================== */

function renderizar(
    canciones
){

    const primero =
        canciones[0];

    const resto =
        canciones.slice(
            1
        );


    const coverPrincipal =
        primero.cover ||
        "https://via.placeholder.com/600x600/080808/00eaff?text=NOVA";


    let html = `

        <article class="top-one">


            <div class="top-cover">

                <img
                    src="${escapar(
                        coverPrincipal
                    )}"
                    alt="${escapar(
                        primero.title
                    )}"
                    loading="eager"
                    onerror="
                        this.src='https://via.placeholder.com/600x600/080808/00eaff?text=NOVA'
                    "
                >

            </div>


            <div>

                <div class="top-label">

                    NÚMERO UNO · TOP 20 NOVA

                </div>


                <div class="top-title">

                    ${escapar(
                        primero.title
                    )}

                </div>


                <div class="top-artist">

                    ${escapar(
                        primero.artist
                    )}

                </div>

            </div>


            <button
                class="request"
                onclick='solicitar(
                    ${JSON.stringify(
                        primero.title
                    )},
                    ${JSON.stringify(
                        primero.artist
                    )}
                )'
            >

                SOLICITAR

            </button>


        </article>


        <div class="ranking">

    `;


    resto.forEach(
        (cancion) => {

            const cover =
                cancion.cover ||
                "https://via.placeholder.com/300x300/080808/00eaff?text=NOVA";


            html += `

                <article class="song">


                    <div class="position">

                        #${escapar(
                            cancion.position
                        )}

                    </div>


                    <div class="cover">

                        <img
                            src="${escapar(
                                cover
                            )}"
                            alt="${escapar(
                                cancion.title
                            )}"
                            loading="lazy"
                            onerror="
                                this.src='https://via.placeholder.com/300x300/080808/00eaff?text=NOVA'
                            "
                        >

                    </div>


                    <div>

                        <div class="song-title">

                            ${escapar(
                                cancion.title
                            )}

                        </div>


                        <div class="song-artist">

                            ${escapar(
                                cancion.artist
                            )}

                        </div>

                    </div>


                    <button
                        class="request"
                        onclick='solicitar(
                            ${JSON.stringify(
                                cancion.title
                            )},
                            ${JSON.stringify(
                                cancion.artist
                            )}
                        )'
                    >

                        SOLICITAR

                    </button>


                </article>

            `;

        }
    );


    html += `

        </div>


        <div class="footer">

            <span>

                <strong>
                    NOVA STEREO
                </strong>

                · Tu radio online

            </span>


            <span>

                TOP 20 NOVA
                · Ranking automático

            </span>

        </div>

    `;


    document.getElementById(
        "content"
    ).innerHTML =
        html;


    document.getElementById(
        "updated"
    ).textContent =
        "Actualizado: " +
        new Date().toLocaleTimeString(
            "es-CR",
            {
                hour:
                    "2-digit",

                minute:
                    "2-digit"
            }
        );

}


/* ==========================================================
   INICIAR
========================================================== */

cargarTop20();


/*
    Refrescar cada 10 minutos.
    GitHub Actions actualiza el JSON
    varias veces al día.
*/

setInterval(
    cargarTop20,
    10 * 60 * 1000
);

</script>


</body>
</html>
