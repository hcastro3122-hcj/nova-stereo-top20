<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TOP 20 NOVA</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050505;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

.top20-wrapper {
    width: 100%;
    max-width: 1250px;
    margin: 0 auto;
    padding: 35px 22px 50px;
}

/* =========================
   ENCABEZADO
========================= */

.top20-header {
    text-align: center;
    margin-bottom: 30px;
}

.top20-header h1 {
    margin: 0;
    font-size: clamp(34px, 5vw, 58px);
    font-weight: 900;
    letter-spacing: 2px;
    line-height: 1;
    background: linear-gradient(90deg, #00eaff, #ffffff, #ff7a00);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.top20-header p {
    margin: 12px 0 0;
    color: #a9a9a9;
    font-size: 14px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

/* =========================
   #1 DESTACADO
========================= */

.featured {
    position: relative;
    display: grid;
    grid-template-columns: 210px 1fr;
    gap: 28px;
    align-items: center;

    padding: 25px;
    margin-bottom: 28px;

    border-radius: 24px;
    border: 1px solid rgba(0, 234, 255, 0.35);

    background:
        linear-gradient(
            135deg,
            rgba(0, 234, 255, 0.08),
            rgba(255, 122, 0, 0.05)
        ),
        #0b0b0b;

    box-shadow:
        0 0 35px rgba(0, 234, 255, 0.08),
        inset 0 0 25px rgba(255,255,255,0.02);
}

.featured-cover {
    width: 210px;
    height: 210px;
    border-radius: 18px;
    overflow: hidden;
    background: #111;
}

.featured-cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.featured-rank {
    font-size: 72px;
    font-weight: 950;
    line-height: 0.9;
    margin-bottom: 10px;

    background: linear-gradient(
        180deg,
        #ffffff 0%,
        #00eaff 55%,
        #267cff 100%
    );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    text-shadow: 0 0 20px rgba(0, 234, 255, 0.2);
}

.featured-song {
    font-size: clamp(25px, 4vw, 42px);
    line-height: 1.05;
    font-weight: 900;
    margin-bottom: 9px;
}

.featured-artist {
    color: #00eaff;
    font-size: clamp(17px, 2vw, 23px);
    font-weight: 700;
}

.featured-genre {
    margin-top: 12px;
    color: #8c8c8c;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
}

/* =========================
   GRID
========================= */

.songs-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
}

/* =========================
   TARJETAS
========================= */

.song-card {
    position: relative;

    min-height: 126px;
    padding: 15px 15px 42px 15px;

    display: grid;
    grid-template-columns: 58px 76px 1fr;
    gap: 14px;
    align-items: center;

    border-radius: 17px;

    background: linear-gradient(
        145deg,
        rgba(255,255,255,0.045),
        rgba(255,255,255,0.015)
    );

    border: 1px solid rgba(255,255,255,0.09);

    transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
}

.song-card:hover {
    transform: translateY(-3px);

    border-color: rgba(0, 234, 255, 0.35);

    box-shadow:
        0 10px 30px rgba(0,0,0,0.35),
        0 0 18px rgba(0,234,255,0.07);
}

/* =========================
   NÚMEROS
========================= */

.rank {
    font-size: 39px;
    font-weight: 950;
    line-height: 1;
    text-align: center;

    background: linear-gradient(
        180deg,
        #ffffff 0%,
        #00eaff 52%,
        #287cff 100%
    );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    filter: drop-shadow(0 0 7px rgba(0,234,255,0.15));
}

/* =========================
   CARÁTULA
========================= */

.cover {
    width: 76px;
    height: 76px;

    border-radius: 12px;
    overflow: hidden;

    background: #111;

    box-shadow:
        0 5px 15px rgba(0,0,0,0.35);
}

.cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* =========================
   INFORMACIÓN
========================= */

.song-info {
    min-width: 0;
    padding-right: 8px;
}

.song-title {
    font-size: 19px;
    line-height: 1.13;
    font-weight: 850;

    color: #ffffff;

    margin-bottom: 6px;

    overflow-wrap: anywhere;
}

.song-artist {
    font-size: 14px;
    line-height: 1.2;
    font-weight: 700;

    color: #00eaff;

    overflow-wrap: anywhere;
}

.song-genre {
    margin-top: 6px;

    font-size: 10px;
    letter-spacing: 0.8px;
    text-transform: uppercase;

    color: #777;
}

/* =========================
   BOTÓN SOLICITAR
========================= */

.request-btn {
    position: absolute;
    right: 13px;
    bottom: 10px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    padding: 5px 11px;

    border-radius: 20px;

    background: rgba(255, 122, 0, 0.88);
    color: white;

    text-decoration: none;

    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.7px;

    border: 1px solid rgba(255, 170, 90, 0.45);

    box-shadow:
        0 0 8px rgba(255,122,0,0.15);

    transition:
        background 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
}

.request-btn:hover {
    background: #ff7a00;

    transform: translateY(-1px);

    box-shadow:
        0 0 14px rgba(255,122,0,0.3);
}

/* =========================
   ESTADO
========================= */

.loading {
    text-align: center;
    padding: 60px 20px;
    color: #888;
    font-size: 15px;
}

.error {
    text-align: center;
    padding: 50px 20px;
    color: #ff7777;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 760px) {

    .top20-wrapper {
        padding: 25px 12px 40px;
    }

    .featured {
        grid-template-columns: 115px 1fr;
        gap: 17px;
        padding: 17px;
        border-radius: 19px;
    }

    .featured-cover {
        width: 115px;
        height: 115px;
        border-radius: 13px;
    }

    .featured-rank {
        font-size: 47px;
    }

    .featured-song {
        font-size: 23px;
    }

    .featured-artist {
        font-size: 15px;
    }

    .songs-grid {
        grid-template-columns: 1fr 1fr;
        gap: 9px;
    }

    .song-card {
        min-height: 115px;

        grid-template-columns: 37px 58px 1fr;

        gap: 8px;

        padding: 12px 9px 38px 9px;

        border-radius: 14px;
    }

    .rank {
        font-size: 29px;
    }

    .cover {
        width: 58px;
        height: 58px;
        border-radius: 9px;
    }

    .song-title {
        font-size: 14px;
        line-height: 1.1;
    }

    .song-artist {
        font-size: 11px;
    }

    .song-genre {
        display: none;
    }

    .request-btn {
        right: 8px;
        bottom: 7px;

        font-size: 8px;
        padding: 4px 8px;
    }
}

@media (max-width: 430px) {

    .songs-grid {
        gap: 8px;
    }

    .song-card {
        grid-template-columns: 31px 50px 1fr;
        gap: 7px;
    }

    .rank {
        font-size: 25px;
    }

    .cover {
        width: 50px;
        height: 50px;
    }

    .song-title {
        font-size: 12.5px;
    }

    .song-artist {
        font-size: 10px;
    }
}
</style>
</head>

<body>

<div class="top20-wrapper">

    <header class="top20-header">
        <h1>TOP 20 NOVA</h1>
        <p>Nuevas más solicitadas · Tendencias musicales</p>
    </header>

    <div id="ranking">
        <div class="loading">Cargando TOP 20 NOVA...</div>
    </div>

</div>

<script>

const JSON_URL =
    "https://hcastro3122-hcj.github.io/nova-stereo-top20/top20.json";

const WHATSAPP =
    "50685838631";


function escapeHTML(text) {

    if (text === undefined || text === null) {
        return "";
    }

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function createRequestLink(song) {

    const title = song.title || "";
    const artist = song.artist || "";

    const message =
        Hola Nova Stereo, quiero solicitar la canción "${title}" de ${artist}.;

    return https://wa.me/${WHATSAPP}?text=${encodeURIComponent(message)};
}


function createFeatured(song) {

    const cover =
        song.cover ||
        song.artwork ||
        "";

    return `
        <section class="featured">

            <div class="featured-cover">
                ${
                    cover
                    ? `<img src="${escapeHTML(cover)}"
                            alt="${escapeHTML(song.title || "")}"
                            loading="eager"
                            onerror="this.style.display='none';">`
                    : ""
                }
            </div>

            <div>

                <div class="featured-rank">
                    01
                </div>

                <div class="featured-song">
                    ${escapeHTML(song.title)}
                </div>

                <div class="featured-artist">
                    ${escapeHTML(song.artist)}
                </div>

                ${
                    song.genre
                    ? `<div class="featured-genre">
                        ${escapeHTML(song.genre)}
                       </div>`
                    : ""
                }

            </div>

        </section>
    `;
}


function createCard(song, index) {

    const position =
        Number(song.position || index + 1);

    const rank =
        String(position).padStart(2, "0");

    const cover =
        song.cover ||
        song.artwork ||
        "";

    const requestURL =
        createRequestLink(song);

    return `
        <article class="song-card">

            <div class="rank">
                ${rank}
            </div>

            <div class="cover">
                ${
                    cover
                    ? `<img src="${escapeHTML(cover)}"
                            alt="${escapeHTML(song.title || "")}"
                            loading="lazy"
                            onerror="this.style.display='none';">`
                    : ""
                }
            </div>

            <div class="song-info">

                <div class="song-title">
                    ${escapeHTML(song.title)}
                </div>

                <div class="song-artist">
                    ${escapeHTML(song.artist)}
                </div>

                ${
                    song.genre
                    ? `<div class="song-genre">
                        ${escapeHTML(song.genre)}
                       </div>`
                    : ""
                }

            </div>

            <a
                class="request-btn"
                href="${requestURL}"
                target="_blank"
                rel="noopener noreferrer"
            >
                SOLICITAR
            </a>

        </article>
    `;
}


async function loadRanking() {

    const container =
        document.getElementById("ranking");

    try {

        const response =
            await fetch(
                JSON_URL + "?t=" + Date.now(),
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {
            throw new Error(
                "No se pudo cargar top20.json"
            );
        }

        const data =
            await response.json();

        if (!Array.isArray(data) || data.length === 0) {
            throw new Error(
                "El ranking está vacío"
            );
        }

        const songs =
            data
                .filter(song => song)
                .sort(
                    (a, b) =>
                        Number(a.position || 999) -
                        Number(b.position || 999)
                )
                .slice(0, 20);

        if (songs.length === 0) {
            throw new Error(
                "No hay canciones disponibles"
            );
        }

        const first =
            songs[0];

        const rest =
            songs.slice(1);

        let html =
            createFeatured(first);

        html +=
            <div class="songs-grid">;

        rest.forEach((song, index) => {

            html +=
                createCard(song, index + 1);

        });

        html +=
            </div>;

        container.innerHTML =
            html;

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="error">
                No se pudo cargar el TOP 20 NOVA.
            </div>
        `;
    }
}


loadRanking();

</script>

</body>
</html>
