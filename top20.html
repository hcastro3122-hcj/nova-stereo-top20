<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TOP 20 NOVA</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#050608;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow-x:hidden;
}

.wrap{
  width:100%;
  max-width:1180px;
  margin:0 auto;
  padding:34px 22px 45px;
}

/* =========================
   ENCABEZADO
========================= */

.header{
  text-align:center;
  margin-bottom:30px;
}

.kicker{
  color:#00eaff;
  font-size:11px;
  font-weight:900;
  letter-spacing:4px;
  text-transform:uppercase;
  margin-bottom:8px;
}

.title{
  margin:0;
  font-size:clamp(34px,6vw,58px);
  line-height:.95;
  font-weight:950;
  letter-spacing:-2px;
  background:linear-gradient(90deg,#00eaff,#ffffff,#ff7a00);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.subtitle{
  margin-top:12px;
  color:#8e99a8;
  font-size:13px;
  letter-spacing:.4px;
}

/* =========================
   ESTADO
========================= */

.status{
  text-align:center;
  color:#687383;
  font-size:12px;
  padding:20px;
}

.status.error{
  color:#ff8c55;
}

/* =========================
   LISTA
========================= */

.list{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

/* =========================
   CARD
========================= */

.card{
  position:relative;
  display:grid;
  grid-template-columns:74px 92px minmax(0,1fr);
  align-items:center;
  min-height:145px;
  padding:15px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:20px;
  background:
    radial-gradient(circle at 15% 50%,rgba(0,234,255,.06),transparent 30%),
    linear-gradient(135deg,#0b0e13,#080a0e 65%,#0b0a08);
  box-shadow:
    0 12px 35px rgba(0,0,0,.35),
    inset 0 0 25px rgba(255,255,255,.015);
  overflow:hidden;
}

.card::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  border-radius:20px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.015);
}

/* =========================
   #1 DESTACADO
========================= */

.card.top{
  grid-column:span 2;
  grid-template-columns:92px 125px minmax(0,1fr) auto;
  min-height:168px;
  padding:18px;
  border-color:rgba(0,234,255,.28);
  background:
    radial-gradient(circle at 12% 50%,rgba(0,234,255,.11),transparent 28%),
    linear-gradient(135deg,#0c1219,#080b10 65%,#0c0b08);
  box-shadow:
    0 0 50px rgba(0,234,255,.10),
    inset 0 0 35px rgba(0,234,255,.025);
}

/* =========================
   POSICIONES
========================= */

.pos{
  text-align:center;
  font-weight:950;
  font-size:42px;
  line-height:1;
  letter-spacing:-2px;

  background:linear-gradient(
    180deg,
    #ffffff 0%,
    #6defff 45%,
    #258dff 100%
  );

  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;

  filter:drop-shadow(0 0 7px rgba(0,234,255,.12));
}

.top .pos{
  font-size:64px;
  color:#00eaff;
  background:none;
  -webkit-background-clip:initial;
  background-clip:initial;
  filter:none;
  text-shadow:0 0 20px rgba(0,234,255,.18);
}

/* =========================
   PORTADAS
========================= */

.cover{
  width:92px;
  height:92px;
  border-radius:16px;
  object-fit:cover;
  display:block;
  background:#121720;
  border:1px solid rgba(255,255,255,.10);
  box-shadow:0 8px 25px rgba(0,0,0,.38);
}

.top .cover{
  width:125px;
  height:125px;
  border-radius:20px;
}

/* =========================
   INFORMACIÓN
========================= */

.info{
  min-width:0;
  padding-right:72px;
}

.top .info{
  padding-right:10px;
}

.song{
  font-size:19px;
  font-weight:950;
  line-height:1.15;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:#ffffff;
}

.top .song{
  font-size:28px;
}

.artist{
  margin-top:7px;
  color:#aeb8c6;
  font-size:14px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.top .artist{
  font-size:15px;
}

/* =========================
   ETIQUETAS
========================= */

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:10px;
}

.badge{
  padding:4px 8px;
  border-radius:999px;
  font-size:9px;
  font-weight:900;
  letter-spacing:.9px;
  text-transform:uppercase;
  border:1px solid rgba(0,234,255,.20);
  color:#a9f8ff;
  background:rgba(0,234,255,.06);
}

.badge.hot{
  color:#ffd0a3;
  border-color:rgba(255,122,0,.28);
  background:rgba(255,122,0,.07);
}

/* =========================
   BARRA
========================= */

.bar{
  margin-top:11px;
  width:min(310px,100%);
  height:4px;
  overflow:hidden;
  border-radius:99px;
  background:#1a2029;
}

.bar span{
  display:block;
  height:100%;
  border-radius:99px;
  background:linear-gradient(90deg,#00eaff,#258dff);
}

/* =========================
   BOTÓN SOLICITAR
========================= */

.request{
  position:absolute;
  right:14px;
  bottom:12px;

  border:1px solid rgba(255,122,0,.45);
  color:#ffad66;
  background:rgba(255,122,0,.07);

  border-radius:9px;
  padding:6px 9px;

  font-size:8px;
  font-weight:950;
  letter-spacing:1px;

  cursor:pointer;
  white-space:nowrap;

  transition:.2s ease;
}

.request:hover{
  background:rgba(255,122,0,.14);
  border-color:#ff7a00;
  color:#ffc58d;
  box-shadow:0 0 16px rgba(255,122,0,.16);
}

/* =========================
   PIE
========================= */

.footer{
  text-align:center;
  margin-top:28px;
  color:#586271;
  font-size:10px;
  letter-spacing:1px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:760px){

  .wrap{
    padding:26px 12px 35px;
  }

  .list{
    grid-template-columns:1fr 1fr;
    gap:9px;
  }

  .card{
    grid-template-columns:48px 64px minmax(0,1fr);
    min-height:125px;
    padding:10px;
    border-radius:15px;
  }

  .card.top{
    grid-column:span 2;
    grid-template-columns:58px 88px minmax(0,1fr);
    min-height:145px;
    padding:12px;
  }

  .pos{
    font-size:29px;
  }

  .top .pos{
    font-size:47px;
  }

  .cover{
    width:64px;
    height:64px;
    border-radius:12px;
  }

  .top .cover{
    width:88px;
    height:88px;
    border-radius:15px;
  }

  .song{
    font-size:15px;
  }

  .top .song{
    font-size:21px;
  }

  .artist{
    font-size:11px;
    margin-top:5px;
  }

  .top .artist{
    font-size:12px;
  }

  .info{
    padding-right:52px;
  }

  .top .info{
    padding-right:45px;
  }

  .meta{
    margin-top:7px;
    gap:4px;
  }

  .badge{
    font-size:7px;
    padding:3px 6px;
  }

  .bar{
    margin-top:7px;
  }

  .request{
    right:8px;
    bottom:8px;
    padding:5px 7px;
    font-size:7px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <header class="header">
    <div class="kicker">Nova Stereo · Tu radio online</div>
    <h1 class="title">TOP 20 NOVA</h1>
    <div class="subtitle">
      Las nuevas más solicitadas · Tendencias musicales
    </div>
  </header>

  <div id="status" class="status">
    Cargando TOP 20 NOVA...
  </div>

  <main id="list" class="list"></main>

  <div class="footer">
    Actualización automática · Nova Stereo
  </div>

</div>

<script>

/* ============================================================
   FUENTE REAL DEL RANKING
   ============================================================ */

const JSON_URL =
  'https://hcastro3122-hcj.github.io/nova-stereo-top20/top20.json?v='
  + Date.now();

const WHATSAPP =
  'https://wa.me/50685838631';

/* ============================================================
   SEGURIDAD PARA TEXTO HTML
   ============================================================ */

function esc(value){
  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

/* ============================================================
   ARTWORK
   ============================================================ */

function getArtwork(song){

  const url =
    song.cover ||
    song.artwork ||
    song.image ||
    '';

  return url;
}

/* ============================================================
   BOTÓN SOLICITAR
   ============================================================ */

function requestSong(song){

  const title = song.title || song.name || '';
  const artist = song.artist || song.artistName || '';

  const message =
    'Hola Nova Stereo 👋%0A%0A' +
    'Quiero solicitar esta canción:%0A' +
    '🎵 ' + encodeURIComponent(title) + '%0A' +
    '👤 ' + encodeURIComponent(artist);

  window.open(
    WHATSAPP + '?text=' + message,
    '_blank'
  );
}

/* ============================================================
   RENDER
   ============================================================ */

function renderSongs(songs){

  const list = document.getElementById('list');
  const status = document.getElementById('status');

  if(!Array.isArray(songs) || songs.length === 0){

    status.textContent =
      'No se encontraron canciones en este momento.';

    status.classList.add('error');

    return;
  }

  status.style.display = 'none';

  list.innerHTML = songs.map((song,index)=>{

    const position =
      Number(song.position) || (index + 1);

    const title =
      song.title ||
      song.name ||
      'Sin título';

    const artist =
      song.artist ||
      song.artistName ||
      'Artista desconocido';

    const artwork =
      getArtwork(song);

    const genre =
      song.genre ||
      'Tendencia';

    const countries =
      Array.isArray(song.countries)
        ? song.countries.length
        : 0;

    const isHot =
      position <= 5 ||
      Number(song.score) >= 500;

    const hotBadge =
      isHot
        ? '<span class="badge hot">🔥 HOT</span>'
        : '';

    const countryBadge =
      countries > 0
        ? '<span class="badge">' +
          countries +
          ' PAÍS' +
          (countries === 1 ? '' : 'ES') +
          '</span>'
        : '';

    const rank =
      String(position).padStart(2,'0');

    const topClass =
      position === 1 ? 'top' : '';

    const width =
      Math.max(
        12,
        Math.min(
          100,
          100 - ((position - 1) * 4.2)
        )
      );

    return `
      <article class="card ${topClass}">

        <div class="pos">
          ${rank}
        </div>

        ${
          artwork
          ? `
            <img
              class="cover"
              src="${esc(artwork)}"
              alt="${esc(title)}"
              loading="${position <= 3 ? 'eager' : 'lazy'}"
              onerror="this.style.visibility='hidden'"
            >
          `
          : `
            <div class="cover"></div>
          `
        }

        <div class="info">

          <div
            class="song"
            title="${esc(title)}"
          >
            ${esc(title)}
          </div>

          <div
            class="artist"
            title="${esc(artist)}"
          >
            ${esc(artist)}
          </div>

          <div class="meta">
            <span class="badge">
              ${esc(genre)}
            </span>
            ${countryBadge}
            ${hotBadge}
          </div>

          <div class="bar">
            <span style="width:${width}%"></span>
          </div>

        </div>

        <button
          class="request"
          data-index="${index}"
          type="button"
        >
          SOLICITAR
        </button>

      </article>
    `;

  }).join('');

  document
    .querySelectorAll('.request')
    .forEach(button=>{

      button.addEventListener(
        'click',
        function(){

          const index =
            Number(this.dataset.index);

          requestSong(songs[index]);
        }
      );

    });
}

/* ============================================================
   CARGAR TOP20.JSON DIRECTAMENTE DESDE GITHUB PAGES
   ============================================================ */

async function loadRanking(){

  const status =
    document.getElementById('status');

  try{

    const response =
      await fetch(
        JSON_URL,
        {
          method:'GET',
          cache:'no-store'
        }
      );

    if(!response.ok){

      throw new Error(
        'HTTP ' + response.status
      );
    }

    const data =
      await response.json();

    /*
      El generador actual guarda:
      {
        "songs": [...]
      }

      También dejamos compatibilidad
      por si el JSON viene directamente
      como array.
    */

    const songs =
      Array.isArray(data)
        ? data
        : Array.isArray(data.songs)
          ? data.songs
          : Array.isArray(data.top20)
            ? data.top20
            : [];

    renderSongs(songs);

  }catch(error){

    console.error(
      'Error cargando TOP 20 NOVA:',
      error
    );

    status.textContent =
      'No se pudo cargar el TOP 20. Reintentando...';

    status.classList.add('error');

    /*
      Reintento automático
    */

    setTimeout(
      loadRanking,
      10000
    );
  }
}

/* ============================================================
   INICIO
   ============================================================ */

loadRanking();

</script>

</body>
</html>
