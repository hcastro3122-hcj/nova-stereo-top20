<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TOP 20 NOVA</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#05070a;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.nova-wrap{
    width:calc(100% - 30px);
    max-width:1150px;
    margin:auto;
    padding:45px 0 60px;
}

/* CABECERA */

.nova-header{
    text-align:center;
    margin-bottom:45px;
}

.kicker{
    color:#00e5ff;
    font-size:11px;
    font-weight:bold;
    letter-spacing:4px;
    margin-bottom:14px;
}

.title{
    margin:0;
    font-size:clamp(42px,7vw,72px);
    line-height:.95;
    font-weight:900;
    letter-spacing:-3px;
}

.title span{
    color:#00e5ff;
}

.subtitle{
    max-width:650px;
    margin:17px auto 0;
    color:#7f8994;
    font-size:14px;
    line-height:1.6;
}

/* LINEA */

.section-label{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.section-label::before,
.section-label::after{
    content:"";
    height:1px;
    flex:1;
    background:rgba(255,255,255,.08);
}

.section-label span{
    color:#69737d;
    font-size:9px;
    font-weight:bold;
    letter-spacing:2px;
    text-transform:uppercase;
}

/* #1 */

.featured{
    position:relative;
    display:grid;
    grid-template-columns:340px 1fr;
    align-items:center;
    gap:40px;

    padding:35px;

    margin-bottom:45px;

    border-radius:28px;

    background:
        radial-gradient(
            circle at 85% 30%,
            rgba(0,229,255,.10),
            transparent 30%
        ),
        linear-gradient(
            145deg,
            #0c1218,
            #080b0f
        );

    border:1px solid rgba(0,229,255,.16);

    box-shadow:
        0 25px 70px rgba(0,0,0,.45);
}

.featured-cover{
    width:300px;
    height:300px;

    display:block;
    margin:auto;

    object-fit:cover;

    border-radius:23px;

    background:#10151b;

    box-shadow:
        0 20px 50px rgba(0,0,0,.6),
        0 0 0 1px rgba(0,229,255,.18);
}

.featured-info{
    min-width:0;
}

.number-one{
    color:#ff7a18;
    font-size:11px;
    font-weight:bold;
    letter-spacing:3px;
    margin-bottom:17px;
}

.featured-title{
    margin:0;

    font-size:clamp(35px,5vw,58px);
    line-height:1;

    font-weight:900;

    letter-spacing:-2px;
}

.featured-artist{
    margin-top:13px;

    color:#bdc5cc;

    font-size:16px;
    font-weight:600;
}

.featured-genre{
    margin-top:18px;

    color:#59646f;

    font-size:9px;
    font-weight:bold;

    letter-spacing:2px;

    text-transform:uppercase;
}

.request{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    margin-top:28px;

    min-width:125px;
    height:42px;

    padding:0 20px;

    border-radius:999px;

    color:#fff;

    text-decoration:none;

    font-size:10px;
    font-weight:bold;

    letter-spacing:1.5px;

    border:1px solid rgba(0,229,255,.42);

    background:rgba(0,229,255,.06);

    transition:.25s ease;
}

.request:hover{
    transform:translateY(-2px);

    border-color:#00e5ff;

    background:rgba(0,229,255,.13);

    box-shadow:0 0 25px rgba(0,229,255,.12);
}

/* LISTA */

.ranking{
    display:flex;
    flex-direction:column;

    gap:12px;
}

.song{
    position:relative;

    display:grid;

    grid-template-columns:60px 70px 1fr 115px;

    align-items:center;

    min-height:98px;

    padding:12px 18px 12px 8px;

    border-radius:18px;

    border:1px solid rgba(255,255,255,.065);

    background:
        linear-gradient(
            110deg,
            rgba(255,255,255,.025),
            rgba(255,255,255,.008)
        );

    transition:.25s ease;
}

.song:hover{
    transform:translateX(4px);

    border-color:rgba(0,229,255,.20);

    background:
        linear-gradient(
            110deg,
            rgba(0,229,255,.045),
            rgba(255,255,255,.01)
        );
}

.song::before{
    content:"";

    position:absolute;

    left:0;
    top:25%;

    width:2px;
    height:50%;

    border-radius:5px;

    background:#00e5ff;

    opacity:.35;
}

.rank{
    text-align:center;

    color:#515c67;

    font-size:17px;
    font-weight:900;
}

.cover{
    width:68px;
    height:68px;

    object-fit:cover;

    border-radius:13px;

    background:#11161c;

    display:block;

    box-shadow:
        0 8px 20px rgba(0,0,0,.4);
}

.song-info{
    min-width:0;

    padding:0 20px;
}

.song-title{
    margin:0;

    color:#fff;

    font-size:16px;
    font-weight:800;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.artist{
    margin-top:6px;

    color:#77818c;

    font-size:12px;
    font-weight:600;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.genre{
    display:inline-block;

    margin-top:7px;

    color:#525e69;

    font-size:8px;

    font-weight:bold;

    letter-spacing:1.5px;

    text-transform:uppercase;
}

.action{
    text-align:right;
}

.action .request{
    margin:0;

    min-width:105px;

    height:37px;

    padding:0 14px;

    font-size:9px;
}

/* LOADING */

.loading{
    min-height:300px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#69747f;

    font-size:11px;

    letter-spacing:2px;

    text-transform:uppercase;
}

/* ERROR */

.error{
    padding:40px;

    text-align:center;

    border:1px solid rgba(255,255,255,.08);

    border-radius:20px;

    color:#8b959f;

    background:#090d12;
}

/* FOOTER */

.footer{
    margin-top:50px;

    padding-top:25px;

    border-top:1px solid rgba(255,255,255,.06);

    text-align:center;

    color:#56616b;

    font-size:10px;

    letter-spacing:1.5px;
}

/* TABLET */

@media(max-width:800px){

    .featured{
        grid-template-columns:260px 1fr;
        gap:25px;
        padding:25px;
    }

    .featured-cover{
        width:230px;
        height:230px;
    }

    .featured-title{
        font-size:40px;
    }

    .song{
        grid-template-columns:50px 65px 1fr 100px;
    }

    .cover{
        width:62px;
        height:62px;
    }

}

/* CELULAR */

@media(max-width:600px){

    .nova-wrap{
        width:calc(100% - 20px);
        padding-top:30px;
    }

    .nova-header{
        margin-bottom:32px;
    }

    .title{
        font-size:43px;
    }

    .subtitle{
        font-size:12px;
    }

    /* #1 */

    .featured{
        display:block;

        padding:22px;

        text-align:center;

        border-radius:24px;
    }

    .featured-cover{
        width:min(75vw,280px);
        height:min(75vw,280px);

        margin-bottom:25px;
    }

    .number-one{
        margin-bottom:14px;
    }

    .featured-title{
        font-size:34px;
    }

    .featured-artist{
        font-size:13px;
        line-height:1.4;
    }

    .featured-genre{
        margin-top:14px;
    }

    .featured .request{
        margin-top:22px;
    }

    /* CANCIONES */

    .ranking{
        gap:10px;
    }

    .song{
        display:grid;

        grid-template-columns:35px 55px 1fr;

        min-height:91px;

        padding:10px 8px;

        border-radius:16px;
    }

    .rank{
        font-size:13px;
    }

    .cover{
        width:52px;
        height:52px;

        border-radius:10px;
    }

    .song-info{
        padding:0 8px;
    }

    .song-title{
        font-size:13px;
    }

    .artist{
        margin-top:5px;
        font-size:10px;
    }

    .genre{
        margin-top:5px;
        font-size:7px;
    }

    .action{
        grid-column:3;

        text-align:left;

        padding:6px 8px 0;
    }

    .action .request{
        width:100%;

        height:31px;

        min-width:0;
    }

}

</style>
</head>

<body>

<div class="nova-wrap">

    <header class="nova-header">

        <div class="kicker">
            NOVA STEREO
        </div>

        <h1 class="title">
            TOP <span>20</span> NOVA
        </h1>

        <p class="subtitle">
            Las canciones que están sonando fuerte ahora.
            Tendencias, música latina y los éxitos del momento.
        </p>

    </header>


    <div id="app">

        <div class="loading">
            CARGANDO TOP 20 NOVA...
        </div>

    </div>


    <div class="footer">
        NOVA STEREO · TU RADIO ONLINE
    </div>

</div>


<script>

const JSON_URL =
    "https://hcastro3122-hcj.github.io/nova-stereo-top20/top20.json";

const WHATSAPP =
    "50685838631";


function escapeHTML(text){

    return String(text || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function fallbackImage(){

    return "https://dummyimage.com/600x600/0b1117/00e5ff&text=NOVA+STEREO";

}


function getCover(song){

    if(
        song &&
        typeof song.cover === "string" &&
        song.cover.trim() !== ""
    ){

        return song.cover;

    }

    return fallbackImage();

}


function getWhatsApp(song){

    const text =
        "Hola Nova Stereo, quiero solicitar la canción \"" +
        (song.title || "") +
        "\" de " +
        (song.artist || "") +
        ".";

    return (
        "https://wa.me/" +
        WHATSAPP +
        "?text=" +
        encodeURIComponent(text)
    );

}


function button(song){

    return `
        <a
            class="request"
            href="${getWhatsApp(song)}"
            target="_blank"
            rel="noopener"
        >
            SOLICITAR
        </a>
    `;

}


function renderFeatured(song){

    return `

        <div class="section-label">
            <span>La número uno</span>
        </div>

        <section class="featured">

            <div>

                <img
                    class="featured-cover"
                    src="${escapeHTML(getCover(song))}"
                    alt="${escapeHTML(song.title)}"
                    onerror="this.onerror=null;this.src='${fallbackImage()}'"
                >

            </div>


            <div class="featured-info">

                <div class="number-one">
                    TOP 01
                </div>

                <h2 class="featured-title">
                    ${escapeHTML(song.title)}
                </h2>

                <div class="featured-artist">
                    ${escapeHTML(song.artist)}
                </div>

                <div class="featured-genre">
                    ${escapeHTML(song.genre || "NOVA STEREO")}
                </div>

                ${button(song)}

            </div>

        </section>

    `;

}


function renderSong(song){

    const position =
        String(song.position || "").padStart(2,"0");

    return `

        <article class="song">

            <div class="rank">
                ${position}
            </div>


            <img
                class="cover"
                src="${escapeHTML(getCover(song))}"
                alt="${escapeHTML(song.title)}"
                loading="lazy"
                onerror="this.onerror=null;this.src='${fallbackImage()}'"
            >


            <div class="song-info">

                <h3 class="song-title">
                    ${escapeHTML(song.title)}
                </h3>

                <div class="artist">
                    ${escapeHTML(song.artist)}
                </div>

                <span class="genre">
                    ${escapeHTML(song.genre || "NOVA")}
                </span>

            </div>


            <div class="action">

                ${button(song)}

            </div>

        </article>

    `;

}


async function loadTop20(){

    const app =
        document.getElementById("app");

    try{

        const response =
            await fetch(
                JSON_URL + "?nocache=" + Date.now(),
                {
                    method:"GET",
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }

        const data =
            await response.json();

        if(!Array.isArray(data)){

            throw new Error(
                "top20.json no contiene una lista"
            );

        }

        if(data.length === 0){

            throw new Error(
                "top20.json está vacío"
            );

        }

        const songs =
            data
                .slice()
                .sort(function(a,b){

                    return (
                        Number(a.position || 999) -
                        Number(b.position || 999)
                    );

                })
                .slice(0,20);


        const first =
            songs[0];

        const rest =
            songs.slice(1);


        let html =
            renderFeatured(first);


        html += `

            <div class="section-label">
                <span>Posiciones 02 — 20</span>
            </div>

            <section class="ranking">
        `;


        for(let i = 0; i < rest.length; i++){

            html += renderSong(rest[i]);

        }


        html += `
            </section>
        `;


        app.innerHTML = html;

    }
    catch(error){

        console.error(
            "Error cargando TOP 20 NOVA:",
            error
        );

        app.innerHTML = `

            <div class="error">

                <strong>
                    No pudimos cargar el TOP 20 NOVA.
                </strong>

                <br><br>

                ${escapeHTML(error.message)}

            </div>

        `;

    }

}


loadTop20();

</script>

</body>
</html>
