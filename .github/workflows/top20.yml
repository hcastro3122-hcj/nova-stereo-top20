name: Actualizar TOP 20 NOVA

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 11 * * *'
    - cron: '0 17 * * *'
    - cron: '0 23 * * *'

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Generar TOP 20 NOVA
        run: python update_top20.py

      - name: Guardar TOP 20 actualizado
        run: |
          git config user.name 'Nova Stereo'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add top20.json
          git diff --cached --quiet || git commit -m 'Actualizar TOP 20 NOVA'
          git push